[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d2_rl_lab"
version = "0.1.0"
description = "D2 assets, RS06 actuators and tasks using robot_rl_core and vendored RSL-RL."
requires-python = ">=3.12"
dependencies = ["robot_rl_core==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["d2_rl_lab*"]
namespaces = false

[tool.setuptools.package-data]
d2_rl_lab = ["assets/d2_description/**/*", "assets/d2_description/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
